experiment:
  name: baseline
  seed: 42
  device: auto
  rounds: 100
  output_dir: results
  log_dir: run_logs

data:
  dataset: mnist
  root: data_cache
  partition: dirichlet
  num_clients: 12
  dirichlet_alpha: 0.5
  val_fraction: 0.1

model:
  name: cnn
  num_classes: 10

training:
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  batch_size: 64
  eval_batch_size: 512
  local_epochs: 1
  weight_decay: 0.0

estimator:
  name: autograd

attack:
  name: none
  malicious_clients: []
  start_round: 1
  sign_scale: 5.0
  gaussian_std: 1.0

aggregation:
  name: dfedavg
  assumed_f: 2
  trim_ratio: 0.2

network:
  topology: complete
  self_loop: true
  neighbors_per_node: 6
  dynamic: false
  switch_interval: 20
